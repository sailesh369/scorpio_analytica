<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Scorpio Analytica</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=style_v) }}">
</head>
<body class="page-shell">
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <nav class="topbar">
    <a class="brand" href="/">
      <img src="{{ url_for('static', filename='images/scorpio-logo.svg') }}" alt="Scorpio Analytica logo" class="brand-logo">
      <h2>Scorpio Analytica</h2>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-toggle>
      <span></span><span></span><span></span>
    </button>
    <div class="links" id="site-nav" data-nav-links>
      <a href="/">Home</a>
      <a href="/register">Register</a>
    </div>
  </nav>

  <main class="container auth-grid">
    <section class="panel reveal">
      <span class="kicker">Secure Access</span>
      <h1>Log back into your analytics workspace.</h1>
      <p class="muted">Open your saved dashboards, reports, and shareable analysis links.</p>
    </section>
    <section class="auth-card reveal reveal-stagger-1">
      <h2>Login</h2>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post" class="auth-form">
        <label>Username</label>
        <input name="username" required>
        <label>Password</label>
        <input name="password" type="password" required>
        <button class="btn" type="submit">Sign In</button>
      </form>
      <p class="muted auth-note">No account? <a href="/register">Create one</a></p>
    </section>
  </main>

  <footer>© 2026 Scorpio Analytica | Interactive Data Intelligence Platform</footer>
  <script src="{{ url_for('static', filename='main.js', v=main_v) }}" defer></script>
</body>
</html>
